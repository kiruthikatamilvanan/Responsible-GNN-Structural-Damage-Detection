[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnn-shm"
version = "1.0.0"
description = "Responsible Graph-Aware Semi-Supervised Spatio-Temporal Deep Learning for structural damage detection (S2DS)"
authors = [{name = "K. Kiruthika"}, {name = "S. P. Sasirekha"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "Pillow>=9.5", "tqdm", "pyyaml", "matplotlib"]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16"]
explain = ["shap>=0.44", "lime>=0.2", "scikit-image"]

[tool.setuptools.packages.find]
include = ["rgnn_shm*"]
